name: Validate skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill structure
        run: |
          python deliver-code-change/scripts/validate_skill.py deliver-code-change
          python deliver-code-change/scripts/validate_skill.py phase-step-planner
      - name: Run regression tests
        run: |
          python -m unittest discover deliver-code-change/scripts -p "test_*.py" -v
          python -m unittest discover phase-step-planner/scripts -p "test_*.py" -v
      - name: Validate helper contracts
        run: |
          python deliver-code-change/scripts/check_python_contracts.py --contract deliver-code-change/references/contract-example.json --source-root deliver-code-change/scripts
          python phase-step-planner/scripts/validate_handoff_contract.py
